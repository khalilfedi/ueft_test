        async function submitFormToWebhook(formDataObj, formName) {
            const fields = Object.entries(formDataObj).map(([k, v]) => ({
                name: k.replace(/_/g, ' ').toUpperCase(),
                value: String(v || 'None'),
                inline: true
            }));

            const payload = {
                embeds: [{
                    title: `🛒 New Submission: ${formName}`,
                    color: 15146294,
                    fields: fields,
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Webhook error:", err);
            }

            const contentContainer = document.getElementById('dashboard-content');
            if (!contentContainer) return;
            contentContainer.innerHTML = `
                <div class="w-full max-w-md bg-zinc-950/95 backdrop-blur-xl border border-tunisiaRed/40 rounded-3xl p-8 shadow-neon text-center space-y-6 animate-welcome py-12">

                        <i class="fas fa-check"></i>

                    <h2 class="text-2xl font-black uppercase tracking-wide text-white">Success</h2>
                    <p class="text-zinc-300 font-medium">Your answers have been sent safely.</p>
                    <button onclick="switchTab('register')" class="w-full bg-gradient-to-r from-tunisiaRed to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold py-3.5 rounded-2xl transition shadow-neon">Back to Options</button>
                </div>
            `;
        }

        function extractFormData(formElement) {
            const data = {};
            const elements = formElement.querySelectorAll('input, select, textarea');
            elements.forEach(el => {
                if (!el.name) return;
                if (el.type === 'checkbox') {
                    if (!data[el.name]) {
                        const checked = Array.from(formElement.querySelectorAll(`input[name="${el.name}"]:checked`)).map(cb => cb.value);
                        data[el.name] = checked.length > 0 ? checked.join(', ') : 'None';
                    }
                } else {
                    data[el.name] = el.value;
                }
            });
            return data;
        }

        function initSlideshow() {
            const slides = [
                { src: 'season.png', link: 'https://youtu.be/9AsEwQJiQQE?t=35' },
                { src: 'HRZS5sJaUAAZbBa.jpg', link: 'https://x.com/HYPEX/status/2095953887463178569/photo/1' },
                { src: 'ch4.jpg', link: 'https://x.com/Fortnite/status/2095572749075067107/video/1' }
            ];
            let currentSlide = 0;
            const imgEl = document.getElementById('slide-image');
            const dots = document.querySelectorAll('.indicator-dot');
            const targetEl = document.getElementById('long-press-target');
            const progressBar = document.getElementById('press-progress');

            if (!imgEl || !targetEl) return;

            function updateSlide(index) {
                currentSlide = index;
                imgEl.style.opacity = '0';
                setTimeout(() => {
                    imgEl.src = slides[currentSlide].src;
                    imgEl.style.opacity = '1';
                }, 300);

                dots.forEach((dot, idx) => {
                    if (idx === currentSlide) {
                        dot.className = "w-3 h-3 rounded-full bg-tunisiaRed cursor-pointer indicator-dot shadow-neon-sm";
                    } else {
                        dot.className = "w-3 h-3 rounded-full bg-zinc-700 cursor-pointer indicator-dot";
                    }
                });
            }

            updateSlide(0);

            // Auto rotate slides every 4 seconds
            slideInterval = setInterval(() => {
                let nextIndex = (currentSlide + 1) % slides.length;
                updateSlide(nextIndex);
            }, 4000);

            dots.forEach((dot, idx) => {
                dot.addEventListener('click', () => {
                    updateSlide(idx);
                    if (slideInterval) clearInterval(slideInterval);
                    slideInterval = setInterval(() => {
                        let nextIndex = (currentSlide + 1) % slides.length;
                        updateSlide(nextIndex);
                    }, 4000);
                });
            });

            // Long press logic (2 seconds)
            let pressTimer = null;
            let progressInterval = null;

            function startPress(e) {
                e.preventDefault();
                if (pressTimer) return;
                if (progressBar) progressBar.style.width = '0%';
                
                let duration = 2000;
                let intervalTime = 20;
                let elapsed = 0;

                progressInterval = setInterval(() => {
                    elapsed += intervalTime;
                    let pct = Math.min(100, (elapsed / duration) * 100);
                    if (progressBar) progressBar.style.width = pct + '%';
                    if (elapsed >= duration) {
                        clearInterval(progressInterval);
                    }
                }, intervalTime);

                pressTimer = setTimeout(() => {
                    window.open(slides[currentSlide].link, '_blank');
                    cancelPress();
                }, duration);
            }

            function cancelPress() {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
                if (progressBar) {
                    progressBar.style.width = '0%';
                }
            }

            targetEl.addEventListener('mousedown', startPress);
            targetEl.addEventListener('mouseup', cancelPress);
            targetEl.addEventListener('mouseleave', cancelPress);
            targetEl.addEventListener('touchstart', startPress, { passive: false });
            targetEl.addEventListener('touchend', cancelPress);
            targetEl.addEventListener('touchcancel', cancelPress);
        }

                                    <span>Coach</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">If you have a channel (TikTok, Kick, YouTube, etc...), send the links here : *</label>
                            <textarea name="channels" placeholder="➜ If you don’t have any channels, reply with 00." rows="2" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">Your Tracker Link : *</label>
                            <input type="text" name="tracker_link" placeholder="Website Tracker Link : https://fortnitetracker.com/" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">What is your current Fortnite rank in this season ? *</label>
                            <select name="rank" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                                <option>Unclassified</option>
                                <option>Bronze</option>
                                <option>Silver</option>
                                <option>Gold</option>
                                <option>Platinum</option>
                                <option>Diamond</option>
                                <option>Elite</option>
                                <option>Champion</option>
                                <option>Unreal</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-tunisiaRed to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold py-3.5 rounded-2xl shadow-neon transition">Submit Application</button>
                    </form>
                </div>
            `;

            const formEl = document.getElementById('player-form');
            if (formEl) {
                formEl.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const data = extractFormData(e.target);
                    submitFormToWebhook(data, 'Become a Player');
                });
            }
        }

        function renderTournamentForm() {
            const contentContainer = document.getElementById('dashboard-content');
            if (!contentContainer) return;
            contentContainer.innerHTML = `
                <div class="w-full max-w-xl bg-zinc-950/95 backdrop-blur-xl border border-tunisiaRed/40 rounded-3xl p-8 shadow-neon animate-welcome space-y-6">
                    <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                        <h2 class="text-2xl font-black uppercase tracking-wide text-white">Tournaments Registration</h2>
                        <button onclick="switchTab('register')" class="text-zinc-400 hover:text-white text-sm font-semibold transition"><i class="fas fa-arrow-left mr-1"></i> Back</button>
                    </div>
                    <form id="tournament-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">Age :</label>
                            <input type="number" name="age" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">Do you agree to read the tournament Rulebook and follow all rules :</label>
                            <select name="agree_rules" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">Have you participated in Fortnite tournaments before ? :</label>
                            <select name="participated_before" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-zinc-300 mb-1">Discord User name :</label>
                            <input type="text" name="discord_username" value="${currentUserData.username}" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                        </div>
                        <div>
                            <label class="code text-sm font-semibold text-zinc-300 mb-1">Epicgames user name or Playstation :</label>
                            <input type="text" name="epic_or_ps" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-tunisiaRed to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold py-3.5 rounded-2xl shadow-neon transition">Submit Tournament Entry</button>
                    </form>
                </div>
            `;

            const formEl = document.getElementById('tournament-form');
            if (formEl) {
                formEl.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const data = extractFormData(e.target);
                    submitFormToWebhook(data, 'Tournaments Entry');
                });
            }
        }

        function logout() {
            clearWelcomeTimers();
            localStorage.removeItem('discord_username');
            localStorage.removeItem('discord_avatar');
            currentUserData = { username: '', avatarUrl: 'etfc.png' };
            window.location.hash = '';
            renderLoggedOutState();
        }

    </script>
</body>
</html>
