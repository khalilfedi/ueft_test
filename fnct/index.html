    <body class="text-white font-sans antialiased min-h-screen selection:bg-tunisiaRed selection:text-white flex flex-col">

        <div id="app" class="w-full min-h-screen flex flex-col">

        </div>

        <script>
            const CLIENT_ID = "1545751357448003614";
            const REDIRECT_URI = "http://localhost:5500/index1.html";
            const GOOGLE_CLIENT_ID = "";
            const EPIC_CLIENT_ID = "";
            const WEBHOOK_URL = "https://discord.com/api/webhooks/1545751357448003614/cJYvn902vMVGdQ3ohx_h_DKuA1ufD0Rq";
            // ===== SHARED CLOUD STORAGE (JSONBin.io) =====
            // Without this, Owner edits stay only in YOUR browser (localStorage).
            // Setup (free): 1) https://jsonbin.io → Sign up
            // 2) Create a Bin, paste: {}
            // 3) Copy Bin ID + Master Key and paste below:
            const JSONBIN_BIN_ID = "";   // e.g. "65f0a1b2c3d4e5f6a7b8c9d0"
            const JSONBIN_API_KEY = "";  // e.g. "$2a$10$xxxxxxxx"
            const SHARED_KEYS = [
                'site_settings', 'owner_roles', 'welcome_media', 'custom_streamers',
                'custom_tournaments', 'leaderboard_players', 'hidden_streamers',
                'streamer_overrides', 'site_users'
            ];
            let sharedStoreCache = null;
            let sharedStoreReady = false;
            let sharedStoreSaving = false;
            let currentRulebookLang = 'en';
            // Add approved email addresses here. Use lowercase emails.
            const ROLE_USERS = {
                owner: ["khalilfedi349@gmail.com"],
                player: ["player@example.com"],
                streamer: ["streamer@example.com"]
                
            };
            let currentTab = 'welcome';
            let currentUserData = { username: '', avatarUrl: 'etfc.png', description: '', email: '', role: 'member' };
            
            let welcomeTimer = null;
            let slideInterval = null;

            function clearWelcomeTimers() {
                if (welcomeTimer) {
                    clearTimeout(welcomeTimer);
                    welcomeTimer = null;
                }
                if (slideInterval) {
                    clearInterval(slideInterval);
                    slideInterval = null;
                }
            }

            async function fetchFortniteApi(url) {
                const urls = [url, `https://corsproxy.io/?url=${encodeURIComponent(url)}`];
                let lastError;
                for (const apiUrl of urls) {
                    try {
                        const response = await fetch(apiUrl);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return await response.json();
                    } catch (error) {
                        lastError = error;
                    }
                }
                throw lastError;
            }

            async function loadTournaments() {
                const list = document.getElementById('tournament-list');
                if (!list) return;
                try {
                    const result = await fetchFortniteApi('https://fortnite-api.com/v1/events');
                    const data = Array.isArray(result.data) ? result.data : result.data?.events || result.data?.windows || [];
                    if (!data.length) throw new Error('No tournament data returned');
                    const custom = getSiteSettings();
                    list.innerHTML = `<article class="bg-zinc-950 border border-tunisiaRed/40 rounded-3xl p-6 shadow-neon"><span class="text-xs text-tunisiaRed font-bold uppercase">Community Tournament</span><h3 class="text-xl text-white font-black mt-2">${custom.tournamentTitle}</h3><p class="text-zinc-400 text-sm mt-3">Prize: 6,400 V-bucks</p></article>` + data.map(event => `<article class="bg-zinc-950 border border-tunisiaRed/40 rounded-3xl p-6 shadow-neon"><span class="text-xs text-tunisiaRed font-bold uppercase">Tournament / Cup</span><h3 class="text-xl text-white font-black mt-2">${event.name || event.displayName || event.id || 'Fortnite Tournament'}</h3><p class="text-zinc-400 text-sm mt-3">Start: ${event.beginDate || event.startDate || 'Not announced'}</p><p class="text-zinc-400 text-sm">End: ${event.endDate || 'Not announced'}</p></article>`).join('');
                } catch (error) {
                    console.error('Tournament API error:', error);
                    list.innerHTML = '<p class="text-red-500 col-span-full text-center">Tournament data is temporarily unavailable.</p>';
                }
            }

            async function loadItemShop() {
                const list = document.getElementById('item-shop-list');
                if (!list) return;
                try {
                    const result = await fetchFortniteApi('https://fortnite-api.com/v2/shop');
                    const entries = result.data?.featured?.entries || result.data?.daily?.entries || [];
                    if (!entries.length) throw new Error('No shop data returned');
                    list.innerHTML = entries.slice(0, 24).map(entry => {
                        const item = entry.items?.[0] || {};
                        return `<article class="bg-zinc-950 border border-tunisiaRed/40 rounded-2xl overflow-hidden shadow-neon"><img src="${item.images?.icon || 'etfc.png'}" alt="${item.name || 'Item'}" class="w-full aspect-square object-cover"><div class="p-3"><h3 class="font-bold text-white text-sm">${item.name || 'Fortnite Item'}</h3><p class="text-xs text-zinc-400 mt-1">${entry.finalPrice || ''} V-Bucks</p></div></article>`;
                    }).join('');
                } catch (error) {
                    list.innerHTML = '<p class="text-red-500 col-span-full text-center">Item shop data is temporarily unavailable.</p>';
                }
            }

            function setRulebookLang(lang) {
                currentRulebookLang = lang;
                renderDashboardContent();
            }

            function getLocalAccounts() {
                try {
                    return JSON.parse(localStorage.getItem('local_accounts') || '[]');
                } catch (error) {
                    return [];
                }
            }

            function isSharedStorageEnabled() {
                return Boolean(JSONBIN_BIN_ID && JSONBIN_API_KEY);
            }

            function getSiteSettings() {
                const defaults = {
                    siteName: 'Tunisia Fortnite',
                    welcomeText: 'You are officially connected to the Tunisia Fortnite Community Hub. Check out upcoming tournaments or register your squad now!',
                    tournamentTitle: 'Duo reload simpsons map'
                };
                try {
                    return { ...defaults, ...JSON.parse(localStorage.getItem('site_settings') || '{}') };
                } catch (error) {
                    return defaults;
                }
            }

            function readOwnerCollection(key) {
                try {
                    const raw = localStorage.getItem(key);
                    if (raw == null) return key === 'site_users' || key === 'streamer_overrides' || key === 'site_settings' ? {} : [];
                    return JSON.parse(raw);
                } catch (error) {
                    return key === 'site_users' || key === 'streamer_overrides' || key === 'site_settings' ? {} : [];
                }
            }

            function saveOwnerCollection(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
                // Push to cloud so all visitors see Owner changes
                if (SHARED_KEYS.includes(key)) {
                    scheduleSharedStorePush();
                }
            }

            function collectSharedPayload() {
                const payload = {};
                SHARED_KEYS.forEach(key => {
                    try {
                        const raw = localStorage.getItem(key);
                        if (raw != null) payload[key] = JSON.parse(raw);
                        else if (key === 'site_users' || key === 'streamer_overrides' || key === 'site_settings') payload[key] = {};
                        else payload[key] = [];
                    } catch (e) {
                        payload[key] = (key === 'site_users' || key === 'streamer_overrides' || key === 'site_settings') ? {} : [];
                    }
                });
                payload._updatedAt = Date.now();
                return payload;
            }

            function applySharedPayload(data) {
                if (!data || typeof data !== 'object') return;
                SHARED_KEYS.forEach(key => {
                    if (data[key] !== undefined) {
                        localStorage.setItem(key, JSON.stringify(data[key]));
                    }
                });
                sharedStoreCache = data;
            }

            async function pullSharedStore() {
                if (!isSharedStorageEnabled()) {
                    sharedStoreReady = true;
                    return false;
                }
                try {
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        headers: {
                            'X-Master-Key': JSONBIN_API_KEY,
                            'X-Bin-Meta': 'false'
                        }
                    });
                    if (!res.ok) throw new Error('pull ' + res.status);
                    const data = await res.json();
                    // jsonbin returns record directly when X-Bin-Meta false, else .record
                    const record = data.record || data;
                    applySharedPayload(record);
                    sharedStoreReady = true;
                    return true;
                } catch (err) {
                    console.error('Shared store pull failed:', err);
                    sharedStoreReady = true;
                    return false;
                }
            }

            let sharedPushTimer = null;
            function scheduleSharedStorePush() {
                if (!isSharedStorageEnabled()) return;
                if (sharedPushTimer) clearTimeout(sharedPushTimer);
                sharedPushTimer = setTimeout(() => { pushSharedStore(); }, 400);
            }

            async function pushSharedStore() {
                if (!isSharedStorageEnabled() || sharedStoreSaving) return;
                sharedStoreSaving = true;
                try {
                    const payload = collectSharedPayload();
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_API_KEY,
                            'X-Bin-Versioning': 'false'
                        },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error('push ' + res.status);
                    sharedStoreCache = payload;
                } catch (err) {
                    console.error('Shared store push failed:', err);
                    alert('Cloud save failed. Changes are only on this browser until JSONBin is configured correctly.');
                } finally {
                    sharedStoreSaving = false;
                }
            }

            // site_users object helper (was sometimes treated as array collection)
            function getSiteUsers() {
                try {
                    const data = JSON.parse(localStorage.getItem('site_users') || '{}');
                    return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
                } catch (error) {
                    return {};
                }
            }

            function saveSiteUsers(users) {
                localStorage.setItem('site_users', JSON.stringify(users));
                scheduleSharedStorePush();
            }

            function getOwnerRoles() {
                return readOwnerCollection('owner_roles');
            }

            function getWelcomeMedia() {
                return readOwnerCollection('welcome_media');
            }

            function getCustomStreamers() {
                return readOwnerCollection('custom_streamers');
            }

            function getCustomTournaments() {
                return readOwnerCollection('custom_tournaments');
            }

            function getLeaderboardPlayers() {
                return readOwnerCollection('leaderboard_players');
            }

            /** Save / update a user profile so Owner can find them later by email */
            function registerSiteUser(profile) {
                const email = (profile?.email || '').trim().toLowerCase();
                if (!email || !email.includes('@')) return;
                const users = getSiteUsers();
                const prev = users[email] || {};
                const next = {
                    email,
                    username: (profile.username || prev.username || email.split('@')[0]).trim(),
                    avatarUrl: profile.avatarUrl || prev.avatarUrl || 'etfc.png',
                    description: profile.description != null ? profile.description : (prev.description || ''),
                    provider: profile.provider || prev.provider || '',
                    updatedAt: Date.now()
                };
                const isNew = !prev.email;
                users[email] = next;
                saveSiteUsers(users);
                try {
                    const list = JSON.parse(localStorage.getItem('logged_in_emails') || '[]');
                    if (!list.includes(email)) {
                        list.push(email);
                        localStorage.setItem('logged_in_emails', JSON.stringify(list));
                    }
                } catch (e) {}
                // Notify Discord so owner can see logins from any browser
                if (isNew && typeof WEBHOOK_URL === 'string' && WEBHOOK_URL) {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: 'New site login',
                                color: 15146294,
                                fields: [
                                    { name: 'EMAIL', value: email, inline: true },
                                    { name: 'USERNAME', value: next.username || '—', inline: true },
                                    { name: 'PROVIDER', value: next.provider || '—', inline: true },
                                    { name: 'DESCRIPTION', value: next.description || 'None', inline: false }
                                ],
                                thumbnail: next.avatarUrl && next.avatarUrl.startsWith('http') ? { url: next.avatarUrl } : undefined,
                                timestamp: new Date().toISOString()
                            }]
                        })
                    }).catch(() => {});
                }
            }

            function registerLoggedInEmail(email) {
                // backward-compatible: only email, no full profile
                const normalized = (email || '').trim().toLowerCase();
                if (!normalized || !normalized.includes('@')) return;
                const users = getSiteUsers();
                if (!users[normalized]) {
                    registerSiteUser({ email: normalized, username: normalized.split('@')[0], avatarUrl: 'etfc.png', description: '' });
                }
            }

            function isEmailRegistered(email) {
                const normalized = (email || '').trim().toLowerCase();
                if (!normalized) return false;
                if (getSiteUsers()[normalized]) return true;
                if (getLocalAccounts().some(a => (a.email || '').toLowerCase() === normalized)) return true;
                try {
                    const list = JSON.parse(localStorage.getItem('logged_in_emails') || '[]');
                    if (list.includes(normalized)) return true;
                } catch (e) {}
                if (getOwnerRoles().some(r => (r.email || '').toLowerCase() === normalized)) return true;
                const hardcoded = [...(ROLE_USERS.owner || []), ...(ROLE_USERS.player || []), ...(ROLE_USERS.streamer || [])]
                    .map(e => e.toLowerCase());
                return hardcoded.includes(normalized);
            }

            function lookupProfileByEmail(email) {
                const normalized = (email || '').trim().toLowerCase();
                if (!normalized) return null;

                // 1) Central registry (last saved profile from any login)
                const siteUser = getSiteUsers()[normalized];
                if (siteUser) {
                    return {
                        name: siteUser.username || normalized.split('@')[0],
                        image: siteUser.avatarUrl || 'etfc.png',
                        description: siteUser.description || ''
                    };
                }

                // 2) Local email accounts
                const local = getLocalAccounts().find(a => (a.email || '').toLowerCase() === normalized);
                if (local) {
                    return {
                        name: local.username || normalized.split('@')[0],
                        image: local.avatarUrl || 'etfc.png',
                        description: local.description || ''
                    };
                }

                // 3) Owner roles
                const role = getOwnerRoles().find(r => (r.email || '').toLowerCase() === normalized);
                if (role) {
                    return {
                        name: role.role || normalized.split('@')[0],
                        image: role.image || 'etfc.png',
                        description: role.access || ''
                    };
                }

                // 4) Currently logged-in user
                if ((currentUserData.email || '').toLowerCase() === normalized) {
                    return {
                        name: currentUserData.username || normalized.split('@')[0],
                        image: currentUserData.avatarUrl || 'etfc.png',
                        description: currentUserData.description || ''
                    };
                }
                return null;
            }

            function saveLeaderboardPlayer(event) {
                event.preventDefault();
                if (currentUserData.role !== 'owner') return;
                const email = document.getElementById('lb-email').value.trim().toLowerCase();
                if (!email) return;
                const nameInput = (document.getElementById('lb-name')?.value || '').trim();
                const imageInput = (document.getElementById('lb-image')?.value || '').trim();
                const descInput = (document.getElementById('lb-description')?.value || '').trim();
                const rank = parseInt(document.getElementById('lb-rank').value, 10) || 0;
                const points = parseInt(document.getElementById('lb-points').value, 10) || 0;
                const kills = parseInt(document.getElementById('lb-kills').value, 10) || 0;
                const wins = parseInt(document.getElementById('lb-wins').value, 10) || 0;
                const looked = lookupProfileByEmail(email) || {};
                const name = nameInput || looked.name || '';
                const image = imageInput || looked.image || 'etfc.png';
                const description = descInput || looked.description || '';
                if (!isEmailRegistered(email) && !name) {
                    alert('This email is not registered in THIS browser.\n\nProfiles are saved per browser (localStorage).\n\nOptions:\n1) Login once with that account on THIS browser\n2) Or type the Name manually below and save');
                    // show manual fields
                    const manual = document.getElementById('lb-manual-fields');
                    if (manual) manual.classList.remove('hidden');
                    return;
                }
                if (!name) {
                    alert('Player name is required.');
                    return;
                }
                const players = getLeaderboardPlayers().filter(p => p.email !== email);
                players.push({
                    id: crypto.randomUUID(),
                    email,
                    name,
                    image,
                    description,
                    rank,
                    points,
                    kills,
                    wins
                });
                // sort by rank (1 first), then points desc
                players.sort((a, b) => {
                    if (a.rank && b.rank && a.rank !== b.rank) return a.rank - b.rank;
                    if (a.rank && !b.rank) return -1;
                    if (!a.rank && b.rank) return 1;
                    return (b.points || 0) - (a.points || 0);
                });
                saveOwnerCollection('leaderboard_players', players);
                renderDashboardContent();
            }

            function editLeaderboardPlayer(id) {
                if (currentUserData.role !== 'owner') return;
                const players = getLeaderboardPlayers();
                const p = players.find(x => x.id === id);
                if (!p) return;
                const name = prompt('Player name:', p.name);
                if (name === null) return;
                const description = prompt('Description:', p.description || '');
                if (description === null) return;
                const image = prompt('Image URL:', p.image || 'etfc.png');
                if (image === null) return;
                const rankStr = prompt('Top / Rank number (1 = first):', String(p.rank || ''));
                if (rankStr === null) return;
                const pointsStr = prompt('Points:', String(p.points || 0));
                if (pointsStr === null) return;
                const killsStr = prompt('Kills:', String(p.kills || 0));
                if (killsStr === null) return;
                const winsStr = prompt('Wins:', String(p.wins || 0));
                if (winsStr === null) return;
                Object.assign(p, {
                    name: name.trim(),
                    description: description.trim(),
                    image: image.trim() || 'etfc.png',
                    rank: parseInt(rankStr, 10) || 0,
                    points: parseInt(pointsStr, 10) || 0,
                    kills: parseInt(killsStr, 10) || 0,
                    wins: parseInt(winsStr, 10) || 0
                });
                players.sort((a, b) => {
                    if (a.rank && b.rank && a.rank !== b.rank) return a.rank - b.rank;
                    if (a.rank && !b.rank) return -1;
                    if (!a.rank && b.rank) return 1;
                    return (b.points || 0) - (a.points || 0);
                });
                saveOwnerCollection('leaderboard_players', players);
                renderDashboardContent();
            }

            function fillLeaderboardFromEmail() {
                const emailEl = document.getElementById('lb-email');
                if (!emailEl) return;
                const email = emailEl.value.trim().toLowerCase();
                const nameEl = document.getElementById('lb-name');
                const imgEl = document.getElementById('lb-image');
                const descEl = document.getElementById('lb-description');
                const preview = document.getElementById('lb-preview');
                const status = document.getElementById('lb-email-status');
                const manual = document.getElementById('lb-manual-fields');

                if (!email || !email.includes('@')) {
                    if (nameEl) nameEl.value = '';
                    if (imgEl) imgEl.value = '';
                    if (descEl) descEl.value = '';
                    if (preview) preview.classList.add('hidden');
                    if (manual) manual.classList.add('hidden');
                    if (status) { status.textContent = ''; status.className = 'text-xs mt-1'; }
                    return;
                }

                if (!isEmailRegistered(email)) {
                    if (preview) preview.classList.add('hidden');
                    if (manual) manual.classList.remove('hidden');
                    if (status) {
                        status.textContent = 'Not found in THIS browser. Profiles are per-browser. Login once here, or fill Name/Image manually.';
                        status.className = 'text-xs mt-1 text-amber-400 font-semibold';
                    }
                    return;
                }

                const looked = lookupProfileByEmail(email) || {
                    name: email.split('@')[0],
                    image: 'etfc.png',
                    description: ''
                };
                if (nameEl) nameEl.value = looked.name || '';
                if (imgEl) imgEl.value = looked.image || 'etfc.png';
                if (descEl) descEl.value = looked.description || '';
                if (manual) manual.classList.add('hidden');

                if (preview) {
                    preview.classList.remove('hidden');
                    const pImg = document.getElementById('lb-preview-img');
                    const pName = document.getElementById('lb-preview-name');
                    const pDesc = document.getElementById('lb-preview-desc');
                    if (pImg) pImg.src = looked.image || 'etfc.png';
                    if (pName) pName.textContent = looked.name || email.split('@')[0];
                    if (pDesc) pDesc.textContent = looked.description || email;
                }
                if (status) {
                    status.textContent = 'Account found — profile loaded.';
                    status.className = 'text-xs mt-1 text-green-400 font-semibold';
                }
            }

                getOwnerRoles().forEach(r => { if (r.email) emails.add(r.email.toLowerCase()); });

            function setupBuiltInStreamerControls() {
                if (currentUserData.role !== 'owner') return;
                let hidden = readOwnerCollection('hidden_streamers');
                let overrides = JSON.parse(localStorage.getItem('streamer_overrides') || '{}');
                document.querySelectorAll('#dashboard-content .grid > div').forEach(card => {
                    const title = card.querySelector('h3');
                    const image = card.querySelector('img');
                    if (!title || card.querySelector('.owner-streamer-tools')) return;
                    const originalName = title.textContent.trim();
                    if (hidden.includes(originalName)) {
                        card.classList.add('hidden');
                        return;
                    }
                    const override = overrides[originalName] || {};
                    if (override.name) title.textContent = override.name;
                    if (override.image && image) image.src = override.image;
                    const tools = document.createElement('div');
                    tools.className = 'owner-streamer-tools flex gap-2 pt-2';
                    tools.innerHTML = `<button type="button" class="flex-1 bg-yellow-500 text-black py-2 rounded-xl text-xs font-black">Edit</button><button type="button" class="flex-1 bg-red-950 text-red-200 py-2 rounded-xl text-xs font-black">Delete</button>`;

                        const name = prompt('Streamer name:', title.textContent.trim());
                        if (name === null) return;
                        const imageUrl = prompt('Image URL:', image?.src || '');
                        if (imageUrl === null) return;
                        overrides[originalName] = { name: name.trim(), image: imageUrl.trim() };
                        localStorage.setItem('streamer_overrides', JSON.stringify(overrides));
                        scheduleSharedStorePush();
                        setupBuiltInStreamerControls();
                        renderDashboardContent();
                    };
                    tools.children[1].onclick = () => {
                        if (!confirm(`Delete ${title.textContent.trim()}?`)) return;

            function getRoleForEmail(email) {
                const normalizedEmail = (email || '').trim().toLowerCase();
                const customRole = getOwnerRoles().find(item => item.email === normalizedEmail);
                if (customRole) return customRole.role;
                if (ROLE_USERS.owner.map(item => item.toLowerCase()).includes(normalizedEmail)) return 'owner';
                if (ROLE_USERS.streamer.map(item => item.toLowerCase()).includes(normalizedEmail)) return 'streamer';
                if (ROLE_USERS.player.map(item => item.toLowerCase()).includes(normalizedEmail)) return 'player';
                return 'member';
            }

                const icon = icons[role] || icons.member;
                const color = customRole?.color || '#E71D36';
                return `<i class="fas ${icon} ml-1" style="color:${color}" title="${role}${customRole?.access ? `: ${customRole.access}` : ''}"></i>`;
            }

            async function hashPassword(password) {
                const data = new TextEncoder().encode(password);
                const hash = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
            }

            function bootstrapSiteUsersFromLocalAccounts() {
                const accounts = getLocalAccounts();
                accounts.forEach(acc => {
                    if (acc.email) {
                        registerSiteUser({
                            email: acc.email,
                            username: acc.username,
                            avatarUrl: acc.avatarUrl || 'etfc.png',
                            description: acc.description || '',
                            provider: 'email'
                        });
                    }
                });
            }

            window.addEventListener('DOMContentLoaded', async () => {
                // Load Owner content shared with all visitors (Cloudflare / any host)
                await pullSharedStore();
                bootstrapSiteUsersFromLocalAccounts();

                const hash = window.location.hash;
                const savedUser = localStorage.getItem('discord_username');
                const savedAvatar = localStorage.getItem('discord_avatar');
                const savedEmailUser = localStorage.getItem('email_username');
                const savedEmail = localStorage.getItem('email_address');
                const savedEmailAvatar = localStorage.getItem('email_avatar');
                const savedEmailDescription = localStorage.getItem('email_description');
                const savedGoogleUser = localStorage.getItem('google_username');
                const savedEpicUser = localStorage.getItem('epic_username');
                const savedEpicAvatar = localStorage.getItem('epic_avatar');
                const savedEpicDescription = localStorage.getItem('epic_description');
                const savedDiscordAccountKey = localStorage.getItem('discord_account_key') || savedUser;
                const savedGoogleAccountKey = localStorage.getItem('google_account_key') || savedGoogleUser;
                const callbackParams = new URLSearchParams(window.location.search);
                const epicCallback = callbackParams.get('epic');
                const linkCallback = callbackParams.get('linked');

                if (epicCallback === '1') {
                    try {
                        const response = await fetch('/api/auth/epic/me', { credentials: 'include' });
                        if (!response.ok) throw new Error('Epic Games session unavailable');
                        const profile = await response.json();
                        localStorage.setItem('epic_username', profile.username);
                        localStorage.setItem('epic_avatar', profile.avatarUrl || 'etfc.png');
                        localStorage.setItem('epic_description', profile.description || '');
                        if (linkCallback === 'epic') {
                            setLinkedAccount('epic', profile);
                            window.history.replaceState({}, document.title, window.location.pathname);
                            renderDashboard();
                            return;
                        }
                        currentUserData = { ...profile, provider: 'epic', role: getRoleForEmail(profile.email) };
                        registerSiteUser(currentUserData);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        renderDashboard();
                    } catch (error) {
                        console.error('Failed to load Epic Games profile:', error);
                        renderLoggedOutState();
                    }
                } else if (hash.includes('access_token')) {
                    const params = new URLSearchParams(hash.substring(1));
                    const accessToken = params.get('access_token');
                        const state = params.get('state') || '';
                        const provider = state.includes('google') ? 'google' : 'discord';
                        const linking = state.startsWith('link:');
                    renderLoadingState();

                    try {
                        const response = await fetch(provider === 'google' ? 'https://www.googleapis.com/oauth2/v3/userinfo' : 'https://discord.com/api/users/@me', {
                            headers: { Authorization: `Bearer ${accessToken}` }
                        });
                        if (!response.ok) throw new Error('Failed to authenticate with Discord API');

                        const userData = await response.json();
                        const username = provider === 'google' ? (userData.name || userData.email) : (userData.global_name || userData.username);
                        const avatarUrl = provider === 'google'
                            ? (userData.picture || 'etfc.png')
                            : (userData.avatar ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png');

                        localStorage.setItem(`${provider}_username`, username);
                        localStorage.setItem(`${provider}_avatar`, avatarUrl);
                        localStorage.setItem(`${provider}_account_key`, userData.id || username);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        const accountKey = userData.id || username;
                        const override = getProfileOverrides()[`${provider}:${accountKey}`] || {};
                        const profile = { username, avatarUrl, email: provider === 'google' ? (userData.email || '') : '' };
                        if (linking) {
                            setLinkedAccount(provider, profile);
                            window.history.replaceState({}, document.title, window.location.pathname);
                            renderDashboard();
                            return;
                        }
                        currentUserData = { username: override.username || username, avatarUrl: override.avatarUrl || avatarUrl, description: override.description || '', email: profile.email, provider, role: getRoleForEmail(profile.email) };
                        registerSiteUser(currentUserData);
                        renderDashboard();
                    } catch (error) {
                        console.error(`Failed to fetch ${provider} profile:`, error);
                        renderLoggedOutState();
                    }
                } else if (savedUser) {
                    const override = getProfileOverrides()[`discord:${savedDiscordAccountKey}`] || {};
                    currentUserData = { username: override.username || savedUser, avatarUrl: override.avatarUrl || savedAvatar || 'etfc.png', description: override.description || '', email: savedUser, provider: 'discord', role: getRoleForEmail(savedUser) };
                    renderDashboard();
                } else if (savedEmailUser) {
                    currentUserData = { username: savedEmailUser, avatarUrl: savedEmailAvatar || 'etfc.png', description: savedEmailDescription || '', email: savedEmail || '', provider: 'email', role: getRoleForEmail(savedEmail) };
                    registerSiteUser(currentUserData);
                    renderDashboard();
                } else if (savedGoogleUser) {
                    const override = getProfileOverrides()[`google:${savedGoogleAccountKey}`] || {};
                    currentUserData = { username: override.username || savedGoogleUser, avatarUrl: override.avatarUrl || localStorage.getItem('google_avatar') || 'etfc.png', description: override.description || '', email: savedGoogleUser, provider: 'google', role: getRoleForEmail(savedGoogleUser) };
                    registerSiteUser(currentUserData);
                    renderDashboard();
                } else if (savedEpicUser) {
                    currentUserData = { username: savedEpicUser, avatarUrl: savedEpicAvatar || 'etfc.png', description: savedEpicDescription || '', email: savedEpicUser, provider: 'epic', role: getRoleForEmail(savedEpicUser) };
                    renderDashboard();
                } else {
                    renderLoggedOutState();
                }
            });

            function loginWithDiscord(mode = 'login') {
                const params = new URLSearchParams({
                    client_id: CLIENT_ID,
                    redirect_uri: REDIRECT_URI,
                    response_type: 'token',
                    scope: 'identify',
                    state: mode === 'link' ? 'link:discord' : 'login:discord'
                });
                const discordAuthUrl = `https://discord.com/api/oauth2/authorize?${params.toString()}`;
                window.location.href = discordAuthUrl;
            }

            function loginWithGoogle(mode = 'login') {
                if (!GOOGLE_CLIENT_ID) {
                    alert('Google login needs a Google OAuth client ID in the page configuration.');
                    return;
                }
                const params = new URLSearchParams({
                    client_id: GOOGLE_CLIENT_ID,
                    redirect_uri: REDIRECT_URI,
                    response_type: 'token',
                    scope: 'openid email profile',
                    state: mode === 'link' ? 'link:google' : 'google'
                });
                window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params.toString()}`;
            }

            function loginWithEpicGames(mode = 'login') {
                window.location.href = `/api/auth/epic/login${mode === 'link' ? '?mode=link' : ''}`;
            }

                button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');

            async function createEmailAccount(event) {
                event.preventDefault();
                const displayName = document.getElementById('email-display-name').value.trim();
                const email = document.getElementById('email-address').value.trim().toLowerCase();
                const password = document.getElementById('email-password').value;
                const passwordConfirmation = document.getElementById('email-password-confirm').value;
                if (password !== passwordConfirmation) {
                    alert('Passwords do not match.');
                    return;
                }
                const accounts = getLocalAccounts();
                if (accounts.some(account => account.email === email)) {
                    alert('An account with this email already exists.');
                    return;
                }
                const account = { email, username: displayName, passwordHash: await hashPassword(password), avatarUrl: 'etfc.png', description: '' };
                accounts.push(account);
                localStorage.setItem('local_accounts', JSON.stringify(accounts));
                saveLocalSession(account);
                renderDashboard();
            }

            async function signInWithEmail(event) {
                event.preventDefault();
                const email = document.getElementById('signin-email').value.trim().toLowerCase();
                const passwordHash = await hashPassword(document.getElementById('signin-password').value);
                const account = getLocalAccounts().find(item => item.email === email && item.passwordHash === passwordHash);
                if (!account) {
                    alert('Incorrect email or password.');
                    return;
                }
                saveLocalSession(account);
                renderDashboard();
            }

            async function saveAccountChanges(event) {
                event.preventDefault();
                const username = document.getElementById('profile-name').value.trim();
                const description = document.getElementById('profile-description').value.trim();
                const imageUrl = document.getElementById('profile-image-url').value.trim();
                const imageFile = document.getElementById('profile-image-file').files[0];
                let avatarUrl = imageUrl || currentUserData.avatarUrl;

                if (imageFile) {
                    avatarUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(imageFile);
                    });
                }

                const profile = { username, avatarUrl, description };
                if (currentUserData.provider === 'email') {
                    const accounts = getLocalAccounts();
                    const account = accounts.find(item => item.email === currentUserData.email);
                    if (account) {
                        Object.assign(account, profile);
                        localStorage.setItem('local_accounts', JSON.stringify(accounts));
                        saveLocalSession(account);
                    }
                } else {
                    const overrides = getProfileOverrides();
                    const provider = currentUserData.provider || 'discord';
                    const accountKey = localStorage.getItem(`${provider}_account_key`) || currentUserData.username;
                    overrides[`${provider}:${accountKey}`] = profile;
                    localStorage.setItem('profile_overrides', JSON.stringify(overrides));
                    currentUserData = { ...currentUserData, ...profile };
                }
                registerSiteUser(currentUserData);
                renderDashboard();
            }

            async function submitFormToWebhook(formDataObj, formName) {
                const fields = Object.entries(formDataObj).map(([k, v]) => ({
                    name: k.replace(/_/g, ' ').toUpperCase(),
                    value: String(v || 'None'),
                    inline: true
                }));

                const payload = {
                    embeds: [{
                        title: `🛒 New Submission: ${formName}`,
                        color: 15146294,
                        fields: fields,
                        timestamp: new Date().toISOString()
                    }]
                };

                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.error("Webhook error:", err);

                const contentContainer = document.getElementById('dashboard-content');

            function extractFormData(formElement) {
                const data = {};
                const elements = formElement.querySelectorAll('input, select, textarea');
                elements.forEach(el => {
                    if (!el.name) return;
                    if (el.type === 'checkbox') {
                        if (!data[el.name]) {
                            const checked = Array.from(formElement.querySelectorAll(`input[name="${el.name}"]:checked`)).map(cb => cb.value);
                            data[el.name] = checked.length > 0 ? checked.join(', ') : 'None';
                        }
                    } else {
                        data[el.name] = el.value;
                    }
                });
                return data;
            }

            function initSlideshow() {
                const slides = [
                    { src: 'season.png', link: 'https://youtu.be/9AsEwQJiQQE?t=35' },
                    { src: 'HRZS5sJaUAAZbBa.jpg', link: 'https://x.com/HYPEX/status/2095953887463178569/photo/1' },
                    { src: 'ch4.jpg', link: 'https://x.com/Fortnite/status/2095572749075067107/video/1' }
                ];
                let currentSlide = 0;
                const imgEl = document.getElementById('slide-image');
                const dots = document.querySelectorAll('.indicator-dot');
                const targetEl = document.getElementById('long-press-target');
                const progressBar = document.getElementById('press-progress');

                if (!imgEl || !targetEl) return;

                function updateSlide(index) {
                    currentSlide = index;
                    imgEl.style.opacity = '0';
                    setTimeout(() => {
                        imgEl.src = slides[currentSlide].src;
                        imgEl.style.opacity = '1';
                    }, 300);

                    dots.forEach((dot, idx) => {
                        if (idx === currentSlide) {
                            dot.className = "w-3 h-3 rounded-full bg-tunisiaRed cursor-pointer indicator-dot shadow-neon-sm";
                        } else {
                            dot.className = "w-3 h-3 rounded-full bg-zinc-700 cursor-pointer indicator-dot";
                        }
                    });
                }

                updateSlide(0);

                // Auto rotate slides every 4 seconds
                slideInterval = setInterval(() => {
                    let nextIndex = (currentSlide + 1) % slides.length;
                    updateSlide(nextIndex);
                }, 4000);

                dots.forEach((dot, idx) => {
                    dot.addEventListener('click', () => {
                        updateSlide(idx);
                        if (slideInterval) clearInterval(slideInterval);
                        slideInterval = setInterval(() => {
                            let nextIndex = (currentSlide + 1) % slides.length;
                            updateSlide(nextIndex);
                        }, 4000);

                let pressTimer = null;
                let progressInterval = null;

                    e.preventDefault();
                    if (pressTimer) return;
                    if (progressBar) progressBar.style.width = '0%';
                    
                    let duration = 2000;
                    let intervalTime = 20;
                    let elapsed = 0;

                    progressInterval = setInterval(() => {
                        elapsed += intervalTime;
                        let pct = Math.min(100, (elapsed / duration) * 100);
                        if (progressBar) progressBar.style.width = pct + '%';
                        if (elapsed >= duration) {
                            clearInterval(progressInterval);
                        }
                    }, intervalTime);

                    pressTimer = setTimeout(() => {
                        window.open(slides[currentSlide].link, '_blank');
                        cancelPress();
                    }, duration);
                }

                function cancelPress() {
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                    if (progressInterval) {
                        clearInterval(progressInterval);
                        progressInterval = null;
                    }
                    if (progressBar) {
                        progressBar.style.width = '0%';
                    }
                }

                targetEl.addEventListener('mousedown', startPress);
                targetEl.addEventListener('mouseup', cancelPress);
                targetEl.addEventListener('mouseleave', cancelPress);
                targetEl.addEventListener('touchstart', startPress, { passive: false });

                            <button type="submit" class="w-full bg-gradient-to-r from-tunisiaRed to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold py-3.5 rounded-2xl shadow-neon transition">Submit Application</button>
                        </form>
                    </div>
                `;

                const formEl = document.getElementById('player-form');
                if (formEl) {
                    formEl.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const data = extractFormData(e.target);
                        submitFormToWebhook(data, 'Become a Player');
                    });
                }
            }

            function renderTournamentForm() {
                const contentContainer = document.getElementById('dashboard-content');
                if (!contentContainer) return;
                contentContainer.innerHTML = `
                    <div class="w-full max-w-xl bg-zinc-950/95 backdrop-blur-xl border border-tunisiaRed/40 rounded-3xl p-8 shadow-neon animate-welcome space-y-6">
                        <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                            <h2 class="text-2xl font-black uppercase tracking-wide text-white">Tournaments Registration</h2>
                            <button onclick="switchTab('register')" class="text-zinc-400 hover:text-white text-sm font-semibold transition"><i class="fas fa-arrow-left mr-1"></i> Back</button>
                        </div>
                        <form id="tournament-form" class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1">Age :</label>
                                <input type="number" name="age" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1">Do you agree to read the tournament Rulebook and follow all rules :</label>
                                <select name="agree_rules" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                                    <option>Yes</option>
                                    <option>No</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1">Have you participated in Fortnite tournaments before ? :</label>
                                <select name="participated_before" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                                    <option>Yes</option>
                                    <option>No</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1">Discord User name :</label>
                                <input type="text" name="discord_username" value="${currentUserData.username}" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                            </div>
                            <div>
                                <label class="code text-sm font-semibold text-zinc-300 mb-1">Epicgames user name or Playstation :</label>
                                <input type="text" name="epic_or_ps" required class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-tunisiaRed transition">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-tunisiaRed to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold py-3.5 rounded-2xl shadow-neon transition">Submit Tournament Entry</button>
                        </form>
                    </div>
                `;

                const formEl = document.getElementById('tournament-form');
                if (formEl) {
                    formEl.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const data = extractFormData(e.target);
                        submitFormToWebhook(data, 'Tournaments Entry');
                    });
                }
            }

            function logout() {
                clearWelcomeTimers();
                fetch('/api/auth/epic/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
                localStorage.removeItem('discord_username');
                localStorage.removeItem('discord_avatar');
                localStorage.removeItem('email_username');
                localStorage.removeItem('email_address');
                localStorage.removeItem('email_avatar');
                localStorage.removeItem('email_description');
                localStorage.removeItem('google_username');
                localStorage.removeItem('google_avatar');
                localStorage.removeItem('epic_username');
                localStorage.removeItem('epic_avatar');
                localStorage.removeItem('epic_description');
                localStorage.removeItem('discord_account_key');
                localStorage.removeItem('google_account_key');
                currentUserData = { username: '', avatarUrl: 'etfc.png', description: '', email: '' };
                window.location.hash = '';
                renderLoggedOutState();
            }

        </script>
    </body>
    </html>
